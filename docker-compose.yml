# Tek komutla tum sistem:  docker compose up -d --build
#   Frontend : http://localhost:3000
#   API      : http://localhost:8000  (Swagger: /docs)
# Bos bir veritabaninda CV'leri indekslemek icin (tek seferlik):
#   docker compose --profile index run --rm indexer

x-backend: &backend
  build: .
  image: academiq-backend
  env_file: .env
  environment:
    # Container icinden Postgres'e servis adiyla baglanilir (.env'deki host/port disaridan erisim icin)
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
  volumes:
    - ./data:/app/data:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: academiq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - academiq_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    <<: *backend
    container_name: academiq-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: nginx:alpine
    container_name: academiq-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/raw/fake_akademik_cvler:/data/fake_akademik_cvler:ro
    depends_on:
      backend:
        condition: service_healthy

  # Tek seferlik CV indeksleme (varsayilan "up" ile calismaz)
  indexer:
    <<: *backend
    profiles: ["index"]
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "backend.indexing.index_cvs"]

volumes:
  academiq_pgdata:
