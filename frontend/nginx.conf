# Frontend'i statik olarak servis eder (dev_server.py'nin Docker karsiligi).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cache-Control "no-store";

    # Mock modda CV PDF onizlemesi (dev_server.py ile ayni davranis)
    location /mock-pdf/ {
        alias /data/fake_akademik_cvler/;
    }
}
