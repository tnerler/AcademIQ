<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AcademIQ</title>
  <script>
    // Tema, ilk çizimden önce uygulanır (yanlış temanın bir anlık görünmesini önler).
    // Kayıtlı seçim (js/app.js) sistem tercihinin önüne geçer.
    (function () {
      var t = null;
      try { t = localStorage.getItem("academiq-tema"); } catch (e) {}
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-head">
        <a class="brand" href="#/">AcademIQ</a>
        <div class="sidebar-tools">
          <button class="theme-toggle" id="theme-toggle" type="button"></button>
          <button class="menu-toggle" id="menu-toggle" aria-label="Menüyü aç/kapat" aria-expanded="false">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a class="nav-link" href="#/" data-route="home" data-icon="home">Ana Sayfa</a>
        <a class="nav-link" href="#/cvler" data-route="cvler" data-icon="users">CV'ler</a>
        <a class="nav-link" href="#/cv-yukle" data-route="cv-yukle" data-icon="upload">CV Yükle</a>
        <a class="nav-link" href="#/ilanlar" data-route="ilanlar" data-icon="file">Proje İlanları</a>
        <a class="nav-link" href="#/ilan-ekle" data-route="ilan-ekle" data-icon="file-plus" data-passive>İlan Ekle</a>
        <a class="nav-link" href="#/eslestir" data-route="eslestir" data-icon="swap">Eşleştir</a>
        <a class="nav-link" href="#/asistan" data-route="asistan" data-icon="chat">Asistan</a>
        <hr class="nav-sep">
        <div class="nav-group">Akademisyenler için</div>
        <a class="nav-link" href="#/bana-uygun" data-route="bana-uygun" data-icon="user-check">Bana Uygun İlanlar</a>
      </nav>
      <div class="sidebar-foot" id="mode-badge"></div>
    </aside>
    <main class="main" id="app" tabindex="-1"></main>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
